services:
  voice-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: voice-agent
    ports:
      - "8080:8080" # WebSocket + PDF API server
    environment:
      # Azure OpenAI Configuration (required)
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT}
      - AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY}
      - AZURE_OPENAI_DEPLOYMENT=${AZURE_OPENAI_DEPLOYMENT}
      - AZURE_API_VERSION=${AZURE_API_VERSION:-2025-04-01-preview}

      # Azure Speech Services Configuration (required)
      - AZURE_SPEECH_KEY=${AZURE_SPEECH_KEY}
      - AZURE_SPEECH_REGION=${AZURE_SPEECH_REGION}
      - AZURE_SPEECH_LANGUAGE=${AZURE_SPEECH_LANGUAGE:-en-US}
      - AZURE_SPEECH_VOICE=${AZURE_SPEECH_VOICE:-en-US-JennyNeural}

      # Recording Settings
      - ENABLE_RECORDINGS=${ENABLE_RECORDINGS:-false}

      # Debug Settings
      - DEBUG=${DEBUG:-true}
      - VERBOSE=${VERBOSE:-false}

      # Email Configuration
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM=${SMTP_FROM}

      # USDA Data APIs
      - USDA_API_KEY=${USDA_API_KEY}
      - NASS_API_KEY=${NASS_API_KEY}
    volumes:
      # Persist recordings outside container
      - ./recordings:/app/recordings
      # Mount Document directory for dynamic forms
      - ./Document:/app/Document
    restart: unless-stopped
    networks:
      - voice-agent-network

  nextjs-ui:
    build:
      context: ./web_ui_nextjs
      dockerfile: Dockerfile
    container_name: nextjs-ui
    ports:
      - "3000:3000" # Next.js UI
    environment:
      # Auth.js configuration
      - AUTH_SECRET=${AUTH_SECRET}
      - AUTH_MICROSOFT_ENTRA_ID_ID=${AUTH_MICROSOFT_ENTRA_ID_ID}
      - AUTH_MICROSOFT_ENTRA_ID_SECRET=${AUTH_MICROSOFT_ENTRA_ID_SECRET}
      - AUTH_MICROSOFT_ENTRA_ID_ISSUER=${AUTH_MICROSOFT_ENTRA_ID_ISSUER}
    depends_on:
      - voice-agent
    restart: unless-stopped
    networks:
      - voice-agent-network

networks:
  voice-agent-network:
    driver: bridge
